<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Week 10 - POST Method</title>

<style>

body{
font-family:Arial;
background:#f4f8ff;
margin:0;
}

.container{
max-width:600px;
margin:60px auto;
padding:35px;
background:white;
border-radius:12px;
box-shadow:0 4px 15px #0002;
}

h1,h2{
color:#1e3a8a;
}

label{
display:block;
margin:15px 0 6px;
font-weight:bold;
}

input,select{
width:100%;
height:45px;
padding:0 10px;
box-sizing:border-box;
border:1px solid #cbd5e1;
border-radius:7px;
}

button{
width:100%;
margin-top:20px;
height:45px;
background:#2563eb;
color:white;
border:0;
border-radius:7px;
font-size:16px;
cursor:pointer;
}

#result{
margin-top:25px;
padding:20px;
background:#eff6ff;
border-radius:8px;
white-space:pre-line;
}

</style>

</head>

<body>

<div class="container">

<h1>EduSphere</h1>

<h2>Week 10 - Fetch POST Method</h2>

<p>
Send form data using the Fetch API POST method.
</p>

<form id="postForm">

<label for="name">Name</label>

<input type="text"
id="name"
name="name"
required>

<label for="email">Email</label>

<input type="email"
id="email"
name="email"
required>

<label for="course">Course</label>

<select id="course"
name="course"
required>

<option value="">Select Course</option>

<option>Web Programming</option>

<option>Python Programming</option>

<option>Artificial Intelligence</option>

<option>Data Science</option>

</select>

<button type="submit">
Send Data
</button>

</form>

<div id="result">
Server response will appear here.
</div>

</div>

<script>

document.getElementById("postForm")
.addEventListener("submit", function(event){

event.preventDefault();

let formData = new URLSearchParams();

formData.append(
"name",
document.getElementById("name").value
);

formData.append(
"email",
document.getElementById("email").value
);

formData.append(
"course",
document.getElementById("course").value
);

fetch("/submit", {

method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:formData.toString()

})

.then(response => {

if(!response.ok){
throw new Error("POST request failed");
}

return response.text();

})

.then(data => {

document.getElementById("result").textContent=data;

})

.catch(error => {

document.getElementById("result").textContent=
"Error: " + error.message;

});

});

</script>

</body>

</html>
