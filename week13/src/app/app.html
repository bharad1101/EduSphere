<h1>Week 13 - Angular Directives</h1>

<h2>EduSphere - Online Learning Platform</h2>

<button (click)="toggleCourses()">
  Show / Hide Courses
</button>

<hr>

<div *ngIf="showCourses">

  <h3>Available Courses</h3>

  <ul>
    <li
      *ngFor="let course of courses; let i = index"
      [ngClass]="i % 2 === 0 ? 'even' : 'odd'">

      {{ i + 1 }}. {{ course }}

    </li>
  </ul>

</div>

<div *ngIf="!showCourses">
  <p>Courses are currently hidden.</p>
</div>
